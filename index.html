<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Gizz Music</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #121212;
      --elevated: #181818;
      --card: #1f1f1f;
      --surface: #282828;
      --hover: #2a2a2a;
      --text: #fff;
      --muted: #b3b3b3;
      --hint: #7a7a7a;
      --accent: #ffdb4d;
      --accent-hover: #ffe566;
      --accent-text: #121212;
      --border: rgba(255,255,255,.08);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0 16px calc(28px + env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--text);
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: linear-gradient(to bottom, var(--bg) 72%, transparent);
      padding: 16px 0 12px;
    }
    .logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .logo-mark {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--accent); display: grid; place-items: center;
      box-shadow: 0 0 20px rgba(255,219,77,.35);
    }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
    h1 span { color: var(--accent); }
    .search { display: flex; gap: 10px; }
    input {
      min-width: 0; flex: 1; border: 0; border-radius: 999px;
      padding: 13px 18px; background: var(--surface); color: inherit; font-size: 16px; outline: none;
    }
    input:focus { box-shadow: 0 0 0 2px rgba(255,219,77,.35); }
    button {
      border: 0; border-radius: 999px; padding: 12px 18px;
      background: var(--accent); color: var(--accent-text); font-weight: 650; font-size: 14px;
    }
    button.secondary { background: var(--surface); color: inherit; }
    button:disabled { opacity: .45; }
    .tabs { display: flex; gap: 6px; overflow: auto; margin: 12px 0 4px; }
    .tabs button { background: transparent; color: var(--muted); padding: 8px 14px; }
    .tabs button.active { background: var(--accent); color: var(--accent-text); }
    .list { display: grid; gap: 4px; }
    .card {
      display: flex; gap: 12px; align-items: center;
      border-radius: 12px; padding: 8px 10px;
    }
    .card:hover { background: var(--card); }
    .cover {
      width: 56px; height: 56px; border-radius: 8px; object-fit: cover;
      background: var(--surface); flex: none;
      box-shadow: 0 4px 12px rgba(0,0,0,.4);
    }
    .info { min-width: 0; flex: 1; }
    .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
    .actions { display: flex; gap: 4px; flex: none; }
    .actions button { padding: 9px 11px; font-size: 13px; min-width: 40px; border-radius: 12px; }
    .actions button.secondary { background: transparent; color: var(--muted); }
    .empty, .loading { padding: 48px 16px; text-align: center; color: var(--muted); }
    .back { margin: 4px 0 12px; background: transparent; color: var(--muted); padding: 8px 0; }
    h3 { font-size: 18px; font-weight: 700; margin: 0 0 14px; }
    .progress { height: 4px; border-radius: 99px; background: var(--surface); overflow: hidden; margin: 10px 0 6px; }
    .progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    .job { background: var(--card); border-radius: 16px; padding: 14px 16px; margin: 10px 0; border: 1px solid var(--border); }
    .modal { position: fixed; inset: 0; background: #000a; display: none; align-items: flex-end; z-index: 20; }
    .modal.show { display: flex; }
    .sheet {
      width: 100%; max-height: 82vh; overflow: auto; background: var(--elevated);
      border-radius: 20px 20px 0 0; padding: 16px; border-top: 1px solid var(--border);
    }
    pre { white-space: pre-wrap; word-break: break-word; font: 13px ui-monospace, monospace; background: var(--card); padding: 12px; border-radius: 12px; color: var(--muted); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
<header>
  <div class="logo-row">
    <div class="logo-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="#121212"><path d="M12 3c.5 3.4 2.6 6.4 5.8 8C14.6 12.6 12.5 15.6 12 19c-.5-3.4-2.6-6.4-5.8-8C9.4 9.4 11.5 6.4 12 3z"/></svg>
    </div>
    <h1>Gizz <span>Music</span></h1>
  </div>
  <div class="search">
    <input id="q" placeholder="Артист — Название" autocomplete="off">
    <button id="searchBtn">Найти</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-mode="tracks" class="active">Треки</button>
    <button data-mode="albums">Альбомы</button>
    <button data-mode="artists">Артисты</button>
  </div>
</header>

<main>
  <div id="jobs"></div>
  <div id="view"></div>
</main>

<div id="modal" class="modal">
  <div class="sheet">
    <div class="row"><button class="secondary" id="closeModal">Закрыть</button><button id="saveLyrics">Скачать файл</button></div>
    <h3 id="lyricsTitle"></h3>
    <pre id="lyricsText"></pre>
  </div>
</div>

<script>
(() => {
  const tg = window.Telegram?.WebApp;
  tg?.ready(); tg?.expand();

  const API_BASE = new URLSearchParams(location.search).get('api') || window.API_BASE || "https://PLACEHOLDER.lhr.life";

  const q = document.getElementById("q");
  const view = document.getElementById("view");
  const tabs = document.getElementById("tabs");
  const jobs = document.getElementById("jobs");
  const modal = document.getElementById("modal");
  const lyricsTitle = document.getElementById("lyricsTitle");
  const lyricsText = document.getElementById("lyricsText");
  const saveLyrics = document.getElementById("saveLyrics");
  let mode = "tracks";
  let searchData = {tracks:[],albums:[],artists:[]};
  let currentLyrics = null;

  const initData = tg?.initData || "";
  if (!initData) {
    view.innerHTML = '<div class="empty">Открой приложение из Telegram.</div>';
    return;
  }

  function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  function dur(s){s=Number(s||0);return s?`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`:"—";}
  async function api(path, body){
    const r=await fetch(API_BASE+path,{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Telegram-Init-Data":initData},
      body:JSON.stringify(body||{})
    });
    const data=await r.json().catch(()=>({error:"Некорректный ответ API"}));
    if(!r.ok) throw new Error(data.error||`HTTP ${r.status}`);
    return data;
  }

  function setLoading(text="Загрузка…"){view.innerHTML=`<div class="loading">${esc(text)}</div>`;}

  function render(){
    const items=searchData[mode]||[];
    if(!items.length){view.innerHTML='<div class="empty">Ничего не найдено.</div>';return;}
    view.innerHTML=`<div class="list">${items.map((x,i)=>{
      if(mode==="tracks") return `<article class="card">
        <img class="cover" src="${esc(x.cover||"")}" onerror="this.style.visibility='hidden'">
        <div class="info"><div class="title">${esc(x.name)}</div><div class="sub">${esc(x.artist)} · ${dur(x.duration)} · ${esc(x.source_label||x.src)}</div></div>
        <div class="actions"><button onclick="window.dl(${i})">Скачать</button><button class="secondary" onclick="window.lyrics(${i})">Текст</button></div>
      </article>`;
      if(mode==="albums") return `<article class="card">
        <img class="cover" src="${esc(x.cover||"")}" onerror="this.style.visibility='hidden'">
        <div class="info"><div class="title">${esc(x.name)}</div><div class="sub">${esc(x.artist)} · ${x.trackCount||0} треков · ${esc(x.source_label||x.src)}</div></div>
        <div class="actions"><button onclick="window.openAlbum(${i})">Открыть</button></div>
      </article>`;
      return `<article class="card">
        <div class="cover"></div>
        <div class="info"><div class="title">${esc(x.name)}</div><div class="sub">${esc(x.genre||"") } · ${esc(x.source_label||x.src)}</div></div>
        <div class="actions"><button onclick="window.openArtist(${i})">Открыть</button></div>
      </article>`;
    }).join("")}</div>`;
  }
  window.render = render;

  async function search(){
    const query=q.value.trim(); if(!query)return;
    setLoading("Ищу по источникам…");
    try{
      searchData=await api("/api/search",{query});
      render();
    }catch(e){view.innerHTML=`<div class="empty">${esc(e.message)}</div>`;}
  }

  async function startJob(path, body, label){
    const data=await api(path,body);
    const id=data.job_id;
    const el=document.createElement("div");
    el.className="job"; el.id="job-"+id;
    el.innerHTML=`<b>${esc(label)}</b><div class="progress"><i></i></div><small class="jobtext">Запущено…</small>`;
    jobs.prepend(el);
    pollJob(id,el);
  }

  async function pollJob(id,el){
    try{
      const data=await api("/api/job",{job_id:id});
      const pct=Number(data.percent||0);
      el.querySelector("i").style.width=pct+"%";
      el.querySelector(".jobtext").textContent=data.message||`${pct}%`;
      if(data.status==="done"||data.status==="error"){
        if(data.status==="error") el.querySelector(".jobtext").textContent=data.message||"Ошибка";
        else el.querySelector(".jobtext").textContent=data.message||"Готово";
        setTimeout(()=>el.remove(),5000);
        return;
      }
      setTimeout(()=>pollJob(id,el),700);
    }catch(e){
      el.querySelector(".jobtext").textContent=e.message;
      setTimeout(()=>pollJob(id,el),1500);
    }
  }

  window.dl=async i=>{
    const t=searchData.tracks[i]; if(!t)return;
    try{
      await startJob("/api/download",{track:t,mode:"normal"} ,`${t.artist} — ${t.name}`);
    }catch(e){tg?.showAlert?.(e.message);}
  };

  window.lyrics=async i=>{
    const t=searchData.tracks[i]; if(!t)return;
    try{
      const r=await api("/api/lyrics",{artist:t.artist,title:t.name});
      currentLyrics={content:r.content,ext:r.ext,filename:r.filename};
      lyricsTitle.textContent=`${r.artist} — ${r.title} · ${r.ext.toUpperCase()}`;
      lyricsText.textContent=r.content;
      modal.classList.add("show");
    }catch(e){tg?.showAlert?.(e.message);}
  };

  window.openAlbum=async i=>{
    const a=searchData.albums[i]; if(!a)return;
    setLoading("Загружаю треки альбома…");
    try{
      const r=await api("/api/album/tracks",{album:a});
      view.innerHTML=`<button class="secondary back" onclick="window.render()">← Назад</button>
      <h3>${esc(a.artist)} — ${esc(a.name)}</h3>
      <div class="row"><button onclick="window.dlAlbum()">Скачать весь альбом</button></div>
      <div class="list">${r.tracks.map((t,j)=>`<article class="card">
        <div class="info"><div class="title">${j+1}. ${esc(t.name)}</div><div class="sub">${esc(t.artist)} · ${dur(t.duration)}</div></div>
        <div class="actions"><button onclick="window.dlAlbumTrack(${j})">Скачать</button><button class="secondary" onclick="window.lyricsAlbumTrack(${j})">Текст</button></div>
      </article>`).join("")}</div>`;
      window._album={album:a,tracks:r.tracks};
    }catch(e){view.innerHTML=`<div class="empty">${esc(e.message)}</div>`;}
  };
  window.dlAlbum=async()=>{
    if(!window._album)return;
    try{await startJob("/api/album",{album:window._album.album,tracks:window._album.tracks},"Альбом: "+window._album.album.name);}
    catch(e){tg?.showAlert?.(e.message);}
  };
  window.dlAlbumTrack=async i=>{const t=window._album?.tracks?.[i];if(t)await window.dlTrackObj(t);};
  window.lyricsAlbumTrack=async i=>{const t=window._album?.tracks?.[i];if(t)await window.lyricsObj(t);};
  window.dlTrackObj=async t=>{
    try{await startJob("/api/download",{track:t,mode:"normal"},`${t.artist} — ${t.name}`);}
    catch(e){tg?.showAlert?.(e.message);}
  };
  window.lyricsObj=async t=>{
    try{
      const r=await api("/api/lyrics",{artist:t.artist,title:t.name});
      currentLyrics={content:r.content,ext:r.ext,filename:r.filename};
      lyricsTitle.textContent=`${r.artist} — ${r.title} · ${r.ext.toUpperCase()}`;
      lyricsText.textContent=r.content; modal.classList.add("show");
    }catch(e){tg?.showAlert?.(e.message);}
  };

  window.openArtist=async i=>{
    const a=searchData.artists[i]; if(!a)return;
    setLoading("Загружаю артиста…");
    try{
      const r=await api("/api/artist",{artist:a});
      view.innerHTML=`<button class="secondary back" onclick="window.render()">← Назад</button>
      <h3>${esc(a.name)}</h3>
      <div class="tabs"><button class="active">Треки (${r.tracks.length})</button><button onclick="window.artistAlbums()">Альбомы (${r.albums.length})</button></div>
      <div id="artistList" class="list">${r.tracks.map((t,j)=>`<article class="card">
        <div class="info"><div class="title">${j+1}. ${esc(t.name)}</div><div class="sub">${esc(t.artist)} · ${dur(t.duration)}</div></div>
        <div class="actions"><button onclick="window.dlArtistTrack(${j})">Скачать</button><button class="secondary" onclick="window.lyricsArtistTrack(${j})">Текст</button></div>
      </article>`).join("")}</div>`;
      window._artist=r;
    }catch(e){view.innerHTML=`<div class="empty">${esc(e.message)}</div>`;}
  };
  window.dlArtistTrack=async i=>{const t=window._artist?.tracks?.[i];if(t)await window.dlTrackObj(t);};
  window.lyricsArtistTrack=async i=>{const t=window._artist?.tracks?.[i];if(t)await window.lyricsObj(t);};
  window.openArtistAlbum=async i=>{const a=window._artist?.albums?.[i];if(a)window.openAlbumObj(a);};
  window.artistAlbums=()=>{
    if(!window._artist)return;
    document.getElementById("artistList").innerHTML=window._artist.albums.map((a,i)=>`<article class="card">
      <img class="cover" src="${esc(a.cover||"")}" onerror="this.style.visibility='hidden'">
      <div class="info"><div class="title">${esc(a.name)}</div><div class="sub">${esc(a.artist)} · ${a.trackCount||0} треков</div></div>
      <div class="actions"><button onclick="window.openAlbumObjByIndex(${i})">Открыть</button></div>
    </article>`).join("");
  };
  window.openAlbumObj=a=>{
    const old=searchData.albums; searchData.albums=[a]; openAlbum(0).finally(()=>searchData.albums=old);
  };
  window.openAlbumObjByIndex=i=>{const a=window._artist?.albums?.[i];if(a)window.openAlbumObj(a);};

  document.getElementById("searchBtn").onclick=search;
  q.addEventListener("keydown",e=>{if(e.key==="Enter")search();});
  tabs.addEventListener("click",e=>{
    const b=e.target.closest("button[data-mode]"); if(!b)return;
    mode=b.dataset.mode; tabs.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b)); render();
  });
  document.getElementById("closeModal").onclick=()=>modal.classList.remove("show");
  modal.onclick=e=>{if(e.target===modal)modal.classList.remove("show");};
  saveLyrics.onclick=()=>{
    if(!currentLyrics)return;
    const blob=new Blob([currentLyrics.content],{type:"text/plain;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=currentLyrics.filename;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
})();
</script>
</body>
</html>
